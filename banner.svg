<svg fill="none" viewBox="0 0 850 190" width="850" height="190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="190" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="848" height="188" rx="15" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="90" cy="50" r="75" fill="#00F0FF" opacity="0.14" filter="url(#glow)"/>
  <circle cx="760" cy="140" r="85" fill="#FF0080" opacity="0.14" filter="url(#glow)"/>

  <!-- Wave Vector Decoration -->
  <path d="M0 150 C 200 120, 420 180, 620 145 C 720 125, 780 155, 850 140 L 850 190 L 0 190 Z" fill="#00F0FF" opacity="0.04"/>
  <path d="M0 160 C 240 130, 480 185, 850 150 L 850 190 L 0 190 Z" fill="#FF0080" opacity="0.04"/>

  <!-- Main Title -->
  <text x="425" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="4">
    YASIN DUMAN
  </text>

  <!-- Subtitle -->
  <text x="425" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="2.5">
    SOFTWARE ENGINEER  •  BACKEND &amp; FULL-STACK SYSTEMS
  </text>

  <!-- Tech tags -->
  <text x="425" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1">
    .NET  •  C#  •  JAVA  •  MSSQL  •  REACT NATIVE  •  AI WORKFLOWS
  </text>
</svg>
